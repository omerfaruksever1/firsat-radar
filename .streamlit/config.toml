# FırsatRadar teması — "Gece Terminali" (tasarim/ klasörü). Tek, karanlık görünüm.
# Renkler tasarim/README.md'deki tablodan. Kartlar, rozetler ve tablo ayrıntıları styles.py içindeki CSS'tedir.

[theme]
base = "dark"
primaryColor = "#4C7DFF"
backgroundColor = "#0B0D12"
# Giriş kutuları ve açılır listeler
secondaryBackgroundColor = "#0E1117"
textColor = "#E7EAF0"
linkColor = "#8FB0FF"
borderColor = "#2A3140"
codeBackgroundColor = "#11151C"
codeTextColor = "#C9CFDA"
grayColor = "#8C95A5"
blueColor = "#8FB0FF"
greenColor = "#3DD68C"
redColor = "#F26D6D"
orangeColor = "#F5A524"
yellowColor = "#F5A524"
violetColor = "#A78BFA"
greenBackgroundColor = "#12261D"
redBackgroundColor = "#2A1517"
orangeBackgroundColor = "#2A2111"
blueBackgroundColor = "#152036"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["26px", "16px", "16px", "14px", "13px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
metricValueFontSize = "26px"
metricValueFontWeight = 500
baseRadius = "9px"
buttonRadius = "9px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
paddingTop = "1.75rem"
paddingBottom = "2.5rem"

# Grafikler: 1. ana renk (kâr / bu dönem), 2. zarar, 3. önceki dönem
chartCategoricalColors = ["#4C7DFF", "#F26D6D", "#2E3A55", "#8C95A5", "#3DD68C", "#A78BFA", "#F5A524"]
dataframeBorderColor = "#181D26"
dataframeHeaderBackgroundColor = "#11151C"
dataframeHeaderTextColor = "#6B7486"

[theme.sidebar]
backgroundColor = "#0F1218"
# Seçili menü öğesinin zemini
secondaryBackgroundColor = "#1A2030"
textColor = "#AEB6C4"
borderColor = "#1E232D"
codeBackgroundColor = "#131722"
codeTextColor = "#C9CFDA"
primaryColor = "#4C7DFF"
linkColor = "#8FB0FF"
paddingTop = "1rem"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
